name: cosyvoice
channels:
  # 本机 github 不通，统一走 TUNA 镜像（~/.condarc 已配置，此处显式声明）
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge/
dependencies:
  # 解释器锚定 3.10：CosyVoice 生态（pynini/matcha/whisper）的上限
  - python=3.10
  # pynini 需编译 OpenFst，pip 装必失败，必须 conda-forge 预编译包（坑 #1）
  - pynini=2.1.5
  # ffmpeg 由 conda-forge 提供，替代 brew（本机 github 不通，避免 brew 路径）
  - ffmpeg
  # 构建依赖预置：setuptools<81 保住 pkg_resources（坑 #3）；
  # numpy 1.26.4 先于 pip 包就位（whisper/numba 依赖，坑 #4）
  - "setuptools<81"
  - numpy=1.26.4
  - pip
  - pip:
      - -r requirements.mac.txt
